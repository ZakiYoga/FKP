<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <style>
    body{margin:0;padding:0;background:#f4f6f9;font-family:'Segoe UI',Arial,sans-serif}
    .wrap{max-width:600px;margin:32px auto;background:#fff;border-radius:12px;
          overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    .hdr{background:#1d4ed8;padding:24px 32px}
    .hdr h1{margin:0;color:#fff;font-size:20px;font-weight:700}
    .hdr p{margin:4px 0 0;color:#bfdbfe;font-size:13px}
    .bdy{padding:28px 32px;color:#374151}
    .bdy p{margin:0 0 14px;font-size:15px;line-height:1.6}
    .box{border-radius:8px;padding:14px 18px;margin:16px 0;font-size:14px;line-height:1.6}
    .box-blue  {background:#eff6ff;border-left:4px solid #3b82f6;color:#1e40af}
    .box-yellow{background:#fffbeb;border-left:4px solid #f59e0b;color:#78350f}
    .box-red   {background:#fef2f2;border-left:4px solid #ef4444;color:#7f1d1d}
    .box-green {background:#f0fdf4;border-left:4px solid #22c55e;color:#166534}
    .box p{margin:3px 0}
    .badge{display:inline-block;padding:2px 10px;border-radius:999px;
           font-size:12px;font-weight:600}
    .b-blue  {background:#dbeafe;color:#1e40af}
    .b-yellow{background:#fef9c3;color:#854d0e}
    .b-red   {background:#fee2e2;color:#991b1b}
    .b-green {background:#dcfce7;color:#166534}
    .qr-sec{text-align:center;padding:20px 0;border-top:1px solid #f0f0f0;margin-top:20px}
    .qr-sec p{font-size:13px;color:#6b7280;margin:0 0 10px}
    .qr-sec img{width:150px;height:150px;border:1px solid #e5e7eb;border-radius:8px}
    .qr-url{font-size:11px;color:#9ca3af;word-break:break-all;margin-top:8px}
    .btn{display:inline-block;margin-top:14px;padding:11px 26px;
         background:#1d4ed8;color:#fff!important;border-radius:8px;
         text-decoration:none;font-size:14px;font-weight:600}
    .ftr{background:#f9fafb;padding:16px 32px;text-align:center;
         font-size:12px;color:#9ca3af;border-top:1px solid #f0f0f0}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>{{ app_name }}</h1>
    <p>Sistem Formulir Keluhan Pelanggan</p>
  </div>
  <div class="bdy">
    {% block content %}{% endblock %}

    <div class="qr-sec">
      <p>Scan QR Code untuk memantau progres keluhan secara real-time</p>
      <img src="cid:qr_tracking" alt="QR Tracking"/>
      <p class="qr-url">{{ tracking_url }}</p>
      <a href="{{ tracking_url }}" class="btn">🔍 Lihat Status FKP</a>
    </div>
  </div>
  <div class="ftr">
    Email ini dikirim otomatis. Mohon jangan membalas email ini.<br/>© {{ app_name }}
  </div>
</div>
</body>
</html>
